        --text-dim: #9d9d9d;
        --border: rgba(255, 255, 255, 0.12);
        --border-2: rgba(255, 255, 255, 0.07);
    }

    * {

    html,

        .navbar {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;

            transition: opacity 0.15s, transform 0.15s;

        .navbar.popup-open {
            opacity: 0.4;
            pointer-events: none;
            transform: translateX(-50%) scale(0.985);

        .navbar-brand {
            font-weight: 700;
            font-size: 17px;
            color: var(--accent);
            cursor: pointer;

            user-select: none;
            transition: opacity 0.15s;

<script>
    const chat = document.getElementById("chat");
    const empty = document.getElementById("empty");
    const prompt = document.getElementById("prompt");
    const send = document.getElementById("send");
    const model = document.getElementById("model");
    const fileInput = document.getElementById("fileInput");
    const fileName = document.getElementById("fileName");
    const composer = document.getElementById("composer");

    let selectedFile = null;
    let conversation = [];

    function addMessage(type, text, file = null) {
        empty.style.display = "none";

        const wrapper = document.createElement("div");
        wrapper.className = `message ${type}`;

        const bubble = document.createElement("div");
        bubble.className = "bubble";

        if (file) {
            const chip = document.createElement("div");
            chip.className = "file-chip";
            chip.textContent = `📎 ${file.name}`;
            bubble.appendChild(chip);
        }

        const content = document.createElement("div");
        content.textContent = text;

        bubble.appendChild(content);
        wrapper.appendChild(bubble);
        chat.appendChild(wrapper);

        chat.scrollTop = chat.scrollHeight;

        return wrapper;
    }

    function addTyping() {
        const typing = document.createElement("div");

        typing.className = "typing";
        typing.id = "typing";
        typing.textContent = "Thinking...";

        chat.appendChild(typing);
        chat.scrollTop = chat.scrollHeight;

        return typing;
    }

    function setLoading(loading) {
        send.disabled = loading;
    }

    function resizePrompt() {
        prompt.style.height = "48px";
        prompt.style.height = Math.min(prompt.scrollHeight, 180) + "px";
    }

    async function readFile(file) {
    if (!file) {
        return null;
    }

    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
            const base64Data = reader.result.split(',')[1];
            
            resolve({
                mimeType: file.type || 'text/plain',
                data: base64Data
            });
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

async function askGemini(message, fileObj, modelKey) {
    // Add instruction to enforce plain text over LaTeX formatting
    const formattedPrompt = `[System Rule: Do not use LaTeX syntax, dollar signs ($), or symbols like \\times. Use plain text and standard operators like 'x' or '*'.]\n\n${message || "Analyze the attached file."}`;

    const parts = [
        { text: formattedPrompt }
    ];

    if (fileObj) {
        parts.push({
            inlineData: {
                mimeType: fileObj.mimeType,
                data: fileObj.data
            }
        });
    }

    const actualModelName = window.AI_MODELS[modelKey];

    const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(actualModelName)}:generateContent?key=${encodeURIComponent(window.AI_KEYS.gemini)}`,
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ contents: [{ parts }] })
        }
    );

    const data = await response.json();

    if (!response.ok) {
        throw new Error(data?.error?.message || "Gemini request failed.");
    }

    return data?.candidates?.[0]?.content?.parts
        ?.map(part => part.text || "")
        ?.join("") || "No response returned.";
}

async function submitMessage() {
    const message = prompt.value.trim();

    if (!message && !selectedFile) {
        return;
    }

    const file = selectedFile;

    addMessage(
        "user",
        message || "Analyze this file.",
        file
    );

    prompt.value = "";
    resizePrompt();

    selectedFile = null;
    fileInput.value = "";
    fileName.textContent = "";

    const typing = addTyping();
    setLoading(true);

    try {
        // Make sure this variable is named fileData
        const fileData = await readFile(file);
        const provider = model.value;

        let reply;

        if (provider.startsWith("gemini")) {
            reply = await askGemini(
                message || "Analyze the attached file.",
                fileData,
                provider
            );
        }

        conversation.push({
            role: "user",
            content: message || "Analyze the attached file."
        });

        conversation.push({
            role: "assistant",
            content: reply
        });

        typing.remove();
        addMessage("ai", reply);

    } catch (error) {
        typing.remove();
        addMessage("ai", `Error: ${error.message}`);
    } finally {
        setLoading(false);
        prompt.focus();
    }
}

    prompt.addEventListener("input", resizePrompt);

    prompt.addEventListener("keydown", event => {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            submitMessage();
        }
    });

    send.addEventListener("click", submitMessage);

    fileInput.addEventListener("change", () => {
        selectedFile = fileInput.files[0] || null;
        fileName.textContent = selectedFile ? selectedFile.name : "";
    });

    composer.addEventListener("dragover", event => {
        event.preventDefault();
        composer.classList.add("drop-active");
    });

    composer.addEventListener("dragleave", () => {
        composer.classList.remove("drop-active");
    });

    composer.addEventListener("drop", event => {
        event.preventDefault();

        composer.classList.remove("drop-active");

        const file = event.dataTransfer.files[0];

        if (!file) {
            return;
        }

        selectedFile = file;
        fileName.textContent = file.name;
    });

document.addEventListener("paste", event => {
    const items = (event.clipboardData || window.clipboardData)?.items;
    if (!items) return;

    for (const item of items) {
        if (item.type.startsWith("image/")) {
            const file = item.getAsFile();
            if (file) {
                selectedFile = file;
                fileName.textContent = file.name || "pasted_image.png";
                event.preventDefault();
                break;
            }
        }
    }
});

</script>
