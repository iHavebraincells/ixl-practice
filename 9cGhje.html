    <style>
        :root {
            --bg: #090909;
            --bg-2: rgba(20, 20, 20, 0.65);
            --bg-4: rgba(255, 255, 255, 0.08);
            --text: #f5f5f5;
            --text-dim: #9d9d9d;
            --border: rgba(255, 255, 255, 0.18);
            --border-2: rgba(255, 255, 255, 0.1);
            --accent: #f5f5f5;
            --accent-glow: rgba(255, 255, 255, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, Arial, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        #snow {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .navbar {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: calc(100% - 32px);
            max-width: 420px;
            height: 46px;
            padding: 0 7px 0 20px;
            border-radius: 23px;
            background: var(--bg-2);
            border: 1px solid var(--border-2);
            box-shadow: 0 2px 24px var(--accent-glow);
            backdrop-filter: blur(18px);
            transition: opacity 0.15s, transform 0.15s;
        }

        .navbar.popup-open {
            opacity: 0.4;
            pointer-events: none;
            transform: translateX(-50%) scale(0.985);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 17px;
            color: var(--accent);
            cursor: pointer;
            letter-spacing: -0.3px;
            user-select: none;
            transition: opacity 0.15s;
            background: none;
            border: none;
            padding: 0;
            line-height: 1;
        }

        .navbar-brand:hover {
            opacity: 0.8;
        }

        .navbar-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .nav-icon {
            height: 36px;
            width: auto;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s ease;
        }

        .nav-icon:hover {
            transform: scale(1.1);
        }

        .nav-btn {
            padding: 6px 14px;
            font-size: 13px;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.15s;
            color: var(--text);
            background: transparent;
            border: 1px solid var(--border-2);
            font-family: inherit;
            white-space: nowrap;
            line-height: 1.3;
        }

        .nav-btn:hover {
            background: var(--bg-4);
            border-color: var(--border);
            transform: scale(1.04);
        }

        .nav-btn:active {
            transform: scale(0.96);
        }

        .nav-btn.active {
            background: var(--bg-4);
            color: var(--accent);
            border-color: var(--border);
        }

        .fc87xy-page {
            position: relative;
            z-index: 1;
            max-width: 880px;
            margin: 0 auto;
            padding: 110px 24px 80px;
        }

        .fc87xy-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .fc87xy-header h1 {
            font-size: 30px;
            font-weight: 600;
            letter-spacing: .05em;
        }

        .fc87xy-header p {
            margin-top: 8px;
            color: var(--text-dim);
            font-size: 13px;
        }

        .fc87xy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
        }

        .fc87xy-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
            background: var(--bg-2);
            border: 1px solid var(--border-2);
            border-radius: 18px;
            padding: 14px;
            cursor: pointer;
            font-family: inherit;
            color: var(--text);
            transition: 0.15s;
        }

        .fc87xy-card:hover {
            background: var(--bg-4);
            border-color: var(--border);
            transform: translateY(-3px);
        }

        .fc87xy-card:active {
            transform: translateY(-1px) scale(0.98);
        }

        .fc87xy-card h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .fc87xy-card p {
            font-size: 13px;
            color: var(--text-dim);
            line-height: 1.5;
        }

        .fc87xy-image {
            width: 100%;
            aspect-ratio: 16 / 10;
            object-fit: cover;
            border-radius: 10px;
            display: block;
        }

        .fc87xy-card.empty {
            align-items: center;
            justify-content: center;
            text-align: center;
            border-style: dashed;
            background: transparent;
            min-height: 140px;
            gap: 6px;
        }

        .fc87xy-card.empty .plus {
            font-size: 22px;
            font-weight: 300;
            color: var(--text-dim);
            line-height: 1;
        }

        .fc87xy-card.empty span.label {
            font-size: 13px;
            color: var(--text-dim);
        }

        .fc87xy-card.empty:hover .plus,
        .fc87xy-card.empty:hover span.label {
            color: var(--text);
        }
    </style>
